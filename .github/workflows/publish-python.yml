name: Build and Publish Python Package

# Be very careful granting extra permissions here, as this workflow uses third party actions.
# Prefer to pin to exact commits for third-party actions. I'm making an exception for actions
# maintained by GitHub itself.

# For now, just trigger this workflow manually.
on:
  workflow_dispatch:
    inputs:
      upload_to_pypi:
        description: "Upload generate package files to PyPI"
        required: true
        type: boolean
      pypi_environment:
        description: "Which PyPI instance to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build_sdist:
    name: Build Python sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install 'build==1.2.2'

      - name: Build sdist
        run: python3 -m build --sdist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdist
          path: ./dist/*.gz
          if-no-files-found: error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-latest]
        # Windows Wheel build doesn't work yet.
        # os: [windows-2022]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        # Linux runner doesn't need Go setup because it's installed
        # separately in each cibuildwheel build container
        if: "${{ runner.os != 'Linux' }}"
        with:
          go-version: "1.24"

      - name: Build wheels
        uses: pypa/cibuildwheel@ee02a1537ce3071a004a6b08c41e72f0fdc42d9a # v3.4.0
        env:
          # Skip 32-bit Windows, 32-bit Linux, musllinux and CPython before 3.9.
          # See https://cibuildwheel.readthedocs.io/en/stable/options/#examples_1
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux* cp38-*"
          CIBW_BEFORE_ALL_LINUX: >
            bash {package}/.github/workflows/install-go.sh &&
            export PATH="$PATH":/usr/local/go/bin &&
            command -v go > /dev/null
          CIBW_ENVIRONMENT: PATH=$PATH:/usr/local/go/bin
          CIBW_TEST_COMMAND: >
            python {package}/python/_jsonnet_test.py

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  upload_to_pypi:
    name: "Upload packages to PyPI"
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-24.04
    if: "${{ inputs.upload_to_pypi }}"
    permissions:
      contents: read
      id-token: write # Needed for PyPI Trusted Publishing
    environment:
      name: "${{ inputs.pypi_environment }}"
      url: "${{ inputs.pypi_environment == 'pypi' && 'https://pypi.org/p/gosonnet' || 'https://test.pypi.org/p/gosonnet' }}"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: cibw-wheels
          pattern: cibw-wheels-*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: sdist
          name: sdist
      - name: Flatten wheels to one directory
        run: |
          mkdir dist
          find cibw-wheels/ -type f -name '*.whl' -exec mv '{}' ./dist/ ';'
          find sdist/ -type f -name '*.gz' -exec mv '{}' ./dist/ ';'
      - name: Publish to TestPyPI
        if: inputs.pypi_environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: inputs.pypi_environment != 'testpypi'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        if: inputs.pypi_environment != 'testpypi'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up failed staging attempt for this exact version (if any)
        if: inputs.pypi_environment != 'testpypi'
        run: |
          python3 - <<'PY'
          import email, glob, re, subprocess, tarfile, zipfile
          seen = set()
          for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
            try:
              if f.endswith(".whl"):
                with zipfile.ZipFile(f) as zf:
                  meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                  msg = email.message_from_bytes(zf.read(meta))
              else:
                with tarfile.open(f) as tf:
                  info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                  msg = email.message_from_bytes(tf.extractfile(info).read())
              pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
              ver = msg["Version"].strip()
            except Exception:
              continue
            if (pkg, ver) in seen:
              continue
            seen.add((pkg, ver))
            if subprocess.run([
                "gcloud", "artifacts", "versions", "describe", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=go-jsonnet--pypi"
            ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              subprocess.run([
                  "gcloud", "artifacts", "versions", "delete", ver,
                  f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=go-jsonnet--pypi", "--quiet"
              ], check=False)
          PY
      - name: Stage distributions to OSS Exit Gate and upload manifest
        if: inputs.pypi_environment != 'testpypi'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -m pip install --upgrade twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          echo "::add-mask::${TWINE_PASSWORD}"
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/go-jsonnet--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            dist/*
          python3 - dist/* <<'PY'
          import email, json, re, sys, tarfile, zipfile
          pairs = set()
          for path in sys.argv[1:]:
            if path.endswith(".whl"):
              with zipfile.ZipFile(path) as zf:
                for name in zf.namelist():
                  if name.endswith(".dist-info/METADATA"):
                    msg = email.message_from_bytes(zf.read(name))
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                    break
            elif path.endswith(".tar.gz"):
              with tarfile.open(path, "r:gz") as tf:
                for member in tf.getmembers():
                  if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                    f = tf.extractfile(member)
                    if f is not None:
                      msg = email.message_from_bytes(f.read())
                      pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                      pairs.add((pkg, msg["Version"].strip()))
                    break
          if not pairs:
            raise SystemExit("ERROR: No .whl/.tar.gz package metadata found for manifest.json")
          manifest = {
              "publish_all": False,
              "publishing_groups": [{
                  "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
              }],
          }
          with open("manifest.json", "w", encoding="utf-8") as fh:
            json.dump(manifest, fh, indent=2)
            fh.write("\n")
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/go-jsonnet/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
